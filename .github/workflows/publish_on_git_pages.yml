name: Build website and deploy 🚀

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The site is a static OpenDesign HTML build (index.html + assets/).
      # No Reflex build step is required anymore.
      - name: Stage site 📦
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - name: Setup Pages 🧱
        uses: actions/configure-pages@v5

      - name: Upload page 🕊️
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
